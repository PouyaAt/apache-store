<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود به پنل مدیریت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 0.9rem;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #334155;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .error-alert {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .submit-btn:hover {
      background-color: #1d4ed8;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.88rem;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1>ورود به مدیریت</h1>
      <p>جهت دسترسی به داشبورد اطلاعات را وارد نمایید</p>
    </div>

    <!-- نمایش پیام خطا در صورت ورود اشتباه -->
    {% if error %}
    <div class="error-alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="username">نام کاربری</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          required 
          autocomplete="username" 
          placeholder="مثال: admin"
        />
      </div>

      <div class="form-group">
        <label for="password">رمز عبور</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          autocomplete="current-password" 
          placeholder="••••••••"
        />
      </div>

      <button type="submit" class="submit-btn">ورود به سیستم</button>
    </form>

    <a href="/" class="back-link">← بازگشت به صفحه اصلی فروشگاه</a>
  </div>

</body>
</html>
